name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste API keys, tokens, credentials, private code, or private paths. Remove them from logs first. Report security problems privately (see SECURITY.md).
  - type: textarea
    id: what
    attributes: { label: What happened, description: What you did, what you expected, and what you saw instead. }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: versions
    attributes: { label: Versions, description: "Promptboard (`node bin/ste.mjs --version`), OS, Node.js, and the CLI with its version.", placeholder: "0.4.0, macOS 26, Node 24.14, Claude Code 2.1" }
    validations: { required: true }
  - type: dropdown
    id: area
    attributes: { label: Area, options: [Compose, Kanban board, Agent terminal, Git worktrees or merge, Install, Other] }
